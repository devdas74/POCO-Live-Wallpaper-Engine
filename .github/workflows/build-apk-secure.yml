name: Build APK (secure signing)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q POCO_Wallpaper_Engine_v8_Image_Video_Launcher_Fixed.zip
          echo "PROJECT_DIR=$PWD/poco_wallpaper_project" >> "$GITHUB_ENV"

      - name: Prepare stable signing
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          POCO_KEYSTORE_B64: ${{ secrets.POCO_KEYSTORE_B64 }}
          POCO_KEYSTORE_PASSWORD: ${{ secrets.POCO_KEYSTORE_PASSWORD }}
          POCO_KEY_ALIAS: ${{ secrets.POCO_KEY_ALIAS }}
          POCO_KEY_PASSWORD: ${{ secrets.POCO_KEY_PASSWORD }}
        run: |
          test -n "$POCO_KEYSTORE_B64" || { echo "Missing POCO_KEYSTORE_B64 repository secret"; exit 1; }
          echo "$POCO_KEYSTORE_B64" | base64 -d > poco-update.jks
          cat > app/signing.gradle.kts <<'KOTLIN'
          android {
              signingConfigs {
                  create("stableDebug") {
                      storeFile = file("../poco-update.jks")
                      storePassword = System.getenv("POCO_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("POCO_KEY_ALIAS")
                      keyPassword = System.getenv("POCO_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("stableDebug")
                  }
              }
          }
          KOTLIN
          printf '\napply(from = "signing.gradle.kts")\n' >> app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          import re, os
          p=Path("app/build.gradle.kts")
          s=p.read_text()
          n=max(2,100+int(os.environ.get("GITHUB_RUN_NUMBER","1")))
          s=re.sub(r'(versionCode\\s*=\\s*)\\d+', r'\\g<1>'+str(n), s, count=1)
          p.write_text(s)
          PY

      - name: Build complete wallpaper controls
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p app/src/main/java/com/poco/wallpaper
          if [ -f ../.github/workflows/build-apk.yml ]; then
            python3 - <<'PY'
            from pathlib import Path
            # The feature-generation block is kept in the legacy workflow.
            # This secure workflow intentionally does not copy its signing material.
            print("Using project source and secure signing configuration.")
            PY
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.2.1'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: poco-live-wallpaper-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
