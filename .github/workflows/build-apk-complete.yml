name: Build APK (complete unsigned)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q POCO_Wallpaper_Engine_v8_Image_Video_Launcher_Fixed.zip
          echo "PROJECT_DIR=$PWD/poco_wallpaper_project" >> "$GITHUB_ENV"

      - name: Prepare complete wallpaper project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/prepare-wallpaper-project.sh"
          bash "$GITHUB_WORKSPACE/scripts/modernize-controls-ui.sh"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.2.1'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: poco-live-wallpaper-complete-unsigned-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Rebuild trigger: package the current main branch exactly as it stands.
