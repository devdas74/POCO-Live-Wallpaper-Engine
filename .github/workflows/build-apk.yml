name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q POCO_Wallpaper_Engine_v8_Image_Video_Launcher_Fixed.zip
          cd poco_wallpaper_project
          echo "PROJECT_DIR=$PWD" >> $GITHUB_ENV

      - name: Add launcher app activity and direct wallpaper setup
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p app/src/main/java/com/poco/wallpaper
          cat > app/src/main/java/com/poco/wallpaper/WallpaperControlsActivity.kt <<'KOTLIN'
          package com.poco.wallpaper

          import android.app.Activity
          import android.app.WallpaperManager
          import android.content.ComponentName
          import android.content.Intent
          import android.os.Bundle
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class WallpaperControlsActivity : Activity() {
              private val wallpaperComponent by lazy {
                  ComponentName(this, PocoLiveWallpaperService::class.java)
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 48, 48, 48)
                  }

                  val title = TextView(this).apply {
                      text = "POCO Live Wallpaper Engine"
                      textSize = 24f
                  }

                  val button = Button(this).apply {
                      text = "Set Live Wallpaper"
                      setOnClickListener { openWallpaperPicker() }
                  }

                  root.addView(title)
                  root.addView(button)
                  setContentView(root)

                  if (savedInstanceState == null) {
                      openWallpaperPicker()
                  }
              }

              private fun openWallpaperPicker() {
                  val intent = Intent(WallpaperManager.ACTION_CHANGE_LIVE_WALLPAPER).apply {
                      putExtra(WallpaperManager.EXTRA_LIVE_WALLPAPER_COMPONENT, wallpaperComponent)
                  }
                  startActivity(intent)
              }
          }
          KOTLIN

          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          activity = '''
              <activity
                  android:name=".WallpaperControlsActivity"
                  android:exported="true"
                  android:label="POCO Live Wallpaper Engine">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>
              </activity>
          '''
          if "WallpaperControlsActivity" not in text:
              text = text.replace("</application>", activity + "\n    </application>")
              manifest.write_text(text)
          PY

      - name: Fix Android VectorDrawable files
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("app/src/main/res/drawable/ic_launcher.xml"),
              Path("app/src/main/res/drawable/preview_thumbnail.xml"),
          ]

          replacements = {
              "ic_launcher.xml":
                  '<path android:fillColor="#FF000000" android:pathData="M82,18 C86.418,18 90,21.582 90,26 C90,30.418 86.418,34 82,34 C77.582,34 74,30.418 74,26 C74,21.582 77.582,18 77.582,18 Z"/>',
              "preview_thumbnail.xml":
                  '<path android:fillColor="#FF000000" android:pathData="M201,38 C212.046,38 221,46.954 221,58 C221,69.046 212.046,78 201,78 C189.954,78 181,69.046 181,58 C181,46.954 189.954,38 201,38 Z"/>',
          }

          for file in files:
              text = file.read_text()
              name = file.name

              if "<circle" in text:
                  import re
                  text = re.sub(r'<circle[^>]*/>', replacements[name], text)

              file.write_text(text)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.2.1'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: poco-live-wallpaper-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
